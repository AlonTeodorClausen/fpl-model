[project]
name = "fpl-free-model"
version = "0.1.0"
description = "Free-data FPL forecasting and transfer planning"
requires-python = ">=3.11"
# Direct runtime dependencies only. Exact tested versions of everything,
# including transitive packages, are pinned in requirements.lock.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "requests>=2.32",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: optional tests contacting public data sources (run with -m live)"]
